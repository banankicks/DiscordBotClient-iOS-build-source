name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile iOS app
        run: |
          xcodebuild build \
            -project iOS/DiscordBotClient.xcodeproj \
            -scheme DiscordBotClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/DiscordBotClient.app" \
            "$RUNNER_TEMP/unsigned-ipa/Payload/DiscordBotClient.app"
          (cd "$RUNNER_TEMP/unsigned-ipa" && zip -qry "$RUNNER_TEMP/DiscordBotClient.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordBotClient-unsigned-ipa
          path: ${{ runner.temp }}/DiscordBotClient.ipa
          if-no-files-found: error
          retention-days: 14
